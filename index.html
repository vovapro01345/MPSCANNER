<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Monitor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>⛏ Minecraft Server Monitor</h1>
            <p>Автоматическая проверка статуса серверов через публичные API</p>
        </header>

        <div class="error-banner" id="errorBanner"></div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Поиск по названию, адресу..." autocomplete="off">
            <select id="filterSelect">
                <option value="all">Все серверы</option>
                <option value="online">Только онлайн</option>
                <option value="offline">Только офлайн</option>
            </select>
            <button id="refreshBtn" type="button">🔄 Обновить всё</button>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="totalCount">—</div>
                <div class="stat-label">Всего</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="onlineCount" style="color:#22c55e;">—</div>
                <div class="stat-label">Онлайн</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="offlineCount" style="color:#ef4444;">—</div>
                <div class="stat-label">Офлайн</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="playersTotal" style="color:#3b82f6;">—</div>
                <div class="stat-label">Игроков</div>
            </div>
        </div>

        <div class="server-grid" id="serverGrid">
            <div class="empty-state">Загрузка серверов...</div>
        </div>

        <footer class="footer">
            <span id="lastUpdate">—</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
